[package]
name = "helsing-hackathon-cars-2026"
version = "0.1.0"
edition = "2024"

[lib]
name = "hackathon"

[[bin]]
name = "request-camera"

[dependencies]
# Keep the control-only CLI buildable on machines without libclang/OpenCV.
opencv =  "0.101.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["blocking"] }

