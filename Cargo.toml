[package]
name = "helsing-hackathon-cars-2026"
version = "0.1.0"
edition = "2024"

[lib]
name = "hackathon"

[[bin]]
name = "request-camera"

[dependencies]
http = "1.5.0"
opencv = "0.101.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.154"
